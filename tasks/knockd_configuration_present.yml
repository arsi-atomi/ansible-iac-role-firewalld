---
- name: "Checking Knockd rule entries"
  ansible.builtin.assert:
    that:
      - item.listen_ip is defined
      - item.listen_ip | string | length > 0
      - item.protected_port is defined
      - item.protected_port | int > 0
      - item.protocol is not defined or item.protocol in ['tcp', 'udp']
      - item.knock_sequence is defined
      - item.knock_sequence is sequence
      - item.knock_sequence | length == 3
    fail_msg: "Each firewalld.knockd.rules entry must include listen_ip, protected_port, optional protocol (tcp/udp), and 3 knock ports."
  loop: "{{ fw_knockd_rules }}"
  loop_control:
    label: "{{ item.listen_ip | default('missing-ip') }}:{{ item.protected_port | default('missing-port') }}"

- name: "Ensuring Knockd sysconfig is present"
  ansible.builtin.template:
    src: "knockd.sysconfig.j2"
    dest: "{{ fw_knockd_sysconfig_path }}"
    owner: "root"
    group: "root"
    mode: "0644"

- name: "Ensuring Knockd main configuration is present"
  ansible.builtin.template:
    src: "knockd.conf.j2"
    dest: "{{ fw_knockd_conf_path }}"
    owner: "root"
    group: "root"
    mode: "0640"
