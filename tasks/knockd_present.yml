---
- name: "Ensuring Knockd package is present"
  ansible.builtin.dnf:
    name: "{{ fw_knockd_package }}"
    state: "present"

- name: "Ensuring Firewalld package is present"
  ansible.builtin.include_tasks: present.yml

- name: "Ensuring Firewalld service is started"
  ansible.builtin.include_tasks: started.yml

- name: "Ensuring Knockd configuration is present"
  ansible.builtin.include_tasks: knockd_configuration_present.yml

- name: "Ensuring Knockd service is started"
  block:
    - name: "Starting Knockd service"
      ansible.builtin.service:
        name: "{{ fw_knockd_service_name }}"
        state: "started"
        enabled: true
  rescue:
    - name: "Collecting Knockd service status"
      ansible.builtin.command:
        cmd: "systemctl status {{ fw_knockd_service_name }} --no-pager -l"
      register: fw_knockd_service_status
      changed_when: false
      failed_when: false

    - name: "Collecting Knockd journal"
      ansible.builtin.command:
        cmd: "journalctl -u {{ fw_knockd_service_name }} --no-pager -n 80"
      register: fw_knockd_service_journal
      changed_when: false
      failed_when: false

    - name: "Failing with Knockd diagnostics"
      ansible.builtin.fail:
        msg: |
          Unable to start {{ fw_knockd_service_name }}.
          systemctl status:
          {{ fw_knockd_service_status.stdout | default('') }}
          {{ fw_knockd_service_status.stderr | default('') }}
          journalctl:
          {{ fw_knockd_service_journal.stdout | default('') }}
          {{ fw_knockd_service_journal.stderr | default('') }}
