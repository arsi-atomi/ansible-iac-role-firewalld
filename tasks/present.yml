---
###############################################################################
#
# present.yml
#
# @author Arsi Atomi
#
###############################################################################

- name: "Ensuring firewalld is present"
  ansible.builtin.dnf:
    name: firewalld
    state: present
    sslverify: "{{ dnf_sslverify | default(true) }}"
    validate_certs: "{{ dnf_validate_certs | default(true) }}"
    disable_gpg_check: "{{ dnf_disable_gpg_check | default(false) }}"
  environment:
    http_proxy: "{{ http_proxy }}"
    https_proxy: "{{ https_proxy }}"
    no_proxy: "{{ no_proxy }}"

###############################################################################
# ENSURING FILESYSTEM CONFIGURATION
###############################################################################

- name: "Ensuring bind mount configuration is present"
  ansible.builtin.include_tasks: bind_present.yml
  when: (iac_blueprint.firewalld.binds | default([])) | length > 0
  vars:
    iac_fs_binds: "{{ iac_blueprint.firewalld.binds | default([]) }}"

- name: "Ensuring filesystem configuration is present"
  ansible.builtin.include_tasks: fs_present.yml
  when: (iac_blueprint.firewalld.directories | default([])) | length > 0 or (iac_blueprint.firewalld.files | default([])) | length > 0
  vars:
    iac_fs_directories: "{{ iac_blueprint.firewalld.directories | default([]) }}"
    iac_fs_files: "{{ iac_blueprint.firewalld.files | default([]) }}"

###############################################################################
# ENSURING CRONJOB CONFIGURATION
###############################################################################

- name: "Ensuring cron configuration is present"
  ansible.builtin.include_tasks: cron_present.yml
  when: iac_blueprint.firewalld.cron is defined
  vars:
    iac_cron: "{{ iac_blueprint.firewalld.cron | default([]) }}"
