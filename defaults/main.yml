---
###############################################################################
#
# DEFAULT CONFIGURATION FOR THE ROLE
#
# Warning! Do not edit this file but set configuration in inventory,
# playbook or as commandline parameter with ansible-playbook command
#
###############################################################################

http_proxy: ""
https_proxy: ""
no_proxy: ""

iac_service_name: "fw"

iac_supported_os:
  - { name: "Rocky", versions: ["8", "9", "10"] }
  - { name: "RedHat", versions: ["8", "9", "10"] }

###############################################################################
# DNF related configurations
###############################################################################

iac_dnf_main_package: "firewalld"
dnf_sslverify: true
dnf_validate_certs: true
dnf_disable_gpg_check: false
dnf_update_cache: true

###############################################################################
# Ansible report on target host
###############################################################################

iac_ansible_report: true
iac_ansible_report_tasks_path: "/root/ansible-report.log"

###############################################################################
# FIREWALLD DEFAULT CONFIGURATION
###############################################################################

fw_zone: "public"
fw_interface: ""
fw_protocol: "tcp"
fw_ipset_type: "hash:net"
fw_config_path: "/etc/firewalld/"

fw_knockd_package: "knock-server"
fw_knockd_service_name: "knockd"
fw_knockd_conf_path: "/etc/knockd.conf"
fw_knockd_sysconfig_path: "/etc/sysconfig/knockd"
fw_knockd_default_zone: "public"
fw_knockd_default_protocol: "tcp"
fw_knockd_default_sequence_timeout: 15
fw_knockd_default_open_duration: 60
